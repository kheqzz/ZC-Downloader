version: "3.8"
services:
  zerochan:
    build: .
    container_name: zerochan
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - zerochan_data:/app/data
    env_file:
      - stack.env
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  zerochan_data:
